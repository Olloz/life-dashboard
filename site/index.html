<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Today</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap" rel="stylesheet">
<style>
:root {
  --mist: #E9EEF2; --panel: #F6F8FA; --ink: #16222E; --slate: #4A5A73; --faint: #8795A6;
  --line: #D3DCE4; --sky: #9DBBD8; --day: #DCE8F3; --night: #CFD7E0;
  --amber: #D9962B; --amber-ink: #8A5A0E; --amber-wash: #FBF0DC;
  --blue: #034694; --blue-wash: #E3ECF7;
  --event: #FFFFFF; --event-edge: #4A5A73; --rain: #5D8FC4;
  --win: #2F7D4F; --draw: #8795A6; --loss: #B2453A;
  --display: "Bricolage Grotesque", system-ui, sans-serif;
  --text: "Albert Sans", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --mist: #101A26; --panel: #172333; --ink: #E4EAF1; --slate: #A7B4C4; --faint: #73839A;
    --line: #26354A; --sky: #5F86AE; --day: #22395A; --night: #0F1925;
    --amber: #E8AE4E; --amber-ink: #F2C67A; --amber-wash: #2E2617;
    --blue: #7FA8E0; --blue-wash: #18283F;
    --event: #22324A; --event-edge: #A7B4C4; --rain: #7FAEDD;
    --win: #5DBB83; --draw: #8795A6; --loss: #E07A6E;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --mist: #101A26; --panel: #172333; --ink: #E4EAF1; --slate: #A7B4C4; --faint: #73839A;
  --line: #26354A; --sky: #5F86AE; --day: #22395A; --night: #0F1925;
  --amber: #E8AE4E; --amber-ink: #F2C67A; --amber-wash: #2E2617;
  --blue: #7FA8E0; --blue-wash: #18283F;
  --event: #22324A; --event-edge: #A7B4C4; --rain: #7FAEDD;
  --win: #5DBB83; --draw: #8795A6; --loss: #E07A6E;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--mist); color: var(--ink); font: 16px/1.5 var(--text); }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; line-height: 1.15; margin: 0; }
h2 { font-size: 1.15rem; margin-bottom: .6rem; }
p { margin: 0; }
.muted { color: var(--slate); }
.small { font-size: .875rem; }
[hidden] { display: none !important; }

/* lock */
.lock { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
.lock form { width: min(100%, 22rem); }
.lock h1 { font-size: 2rem; margin-bottom: .25rem; }
.lock label { display: block; margin: 1.5rem 0 .35rem; font-weight: 700; }
.lock input[type=password] { width: 100%; padding: .7rem .8rem; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
.check { display: flex; gap: .5rem; align-items: center; margin: .8rem 0 1.2rem; color: var(--slate); }
.check input { width: 1.1rem; height: 1.1rem; accent-color: var(--slate); }
.primary { width: 100%; padding: .75rem; border: 0; border-radius: 8px; background: var(--ink); color: var(--mist); font-weight: 700; cursor: pointer; }
.primary:disabled { opacity: .6; cursor: progress; }
.lock-error { color: var(--loss); margin-top: .8rem; min-height: 1.5em; }

/* shell */
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px 48px; }
header.top { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; padding: 18px 0 6px; }
.date { font-family: var(--display); font-weight: 500; font-size: 1rem; color: var(--slate); }
.updated { font-size: .8rem; color: var(--faint); text-align: right; }
.updated.stale { color: var(--amber-ink); font-weight: 700; }
.lockbtn { background: none; border: 0; color: var(--faint); text-decoration: underline; cursor: pointer; padding: 0; font-size: .8rem; }
nav[role=tablist] { display: flex; gap: .25rem; border-bottom: 1px solid var(--line); margin: 6px 0 22px; overflow-x: auto; scrollbar-width: none; }
nav[role=tablist] button { border: 0; background: none; padding: .6rem .85rem; color: var(--slate); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1px; white-space: nowrap; }
nav[role=tablist] button[aria-selected=true] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 700; }
.err { padding: .8rem 1rem; border-radius: 8px; background: var(--panel); color: var(--slate); border: 1px dashed var(--line); }
.empty { color: var(--slate); }

/* today hero */
.hero { margin-bottom: 26px; }
.hero h1 { font-size: clamp(1.9rem, 5.4vw, 3.4rem); font-weight: 700; letter-spacing: -.01em; max-width: 22ch; }
.hero .wx { margin-top: .5rem; color: var(--slate); font-size: 1.05rem; }
.hero .wx strong { color: var(--ink); }

.today { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 32px; align-items: start; }
@media (max-width: 820px) { .today { grid-template-columns: 1fr; } }

/* timeline */
.allday { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: .6rem; }
.chip { padding: .2rem .6rem; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); font-size: .85rem; }
.timeline { position: relative; display: grid; grid-template-columns: 3.6rem 1fr; }
.hours { position: relative; }
.hour { position: absolute; left: 0; right: 0; display: flex; flex-direction: column; font-size: .75rem; color: var(--faint); transform: translateY(-.55em); }
.hour b { color: var(--slate); font-weight: 400; }
.track { position: relative; border-left: 1px solid var(--line); background: var(--night); border-radius: 0 10px 10px 0; overflow: hidden; }
.daylight { position: absolute; left: 0; right: 0; background: var(--day); }
.gridline { position: absolute; left: 0; right: 0; border-top: 1px solid var(--line); opacity: .6; }
.rainbar { position: absolute; left: 0; width: 5px; background: var(--rain); border-radius: 0 3px 3px 0; }
.now { position: absolute; left: 0; right: 0; border-top: 2px solid var(--amber); z-index: 3; }
.now::before { content: ""; position: absolute; left: -5px; top: -6px; width: 10px; height: 10px; border-radius: 50%; background: var(--amber); }
.ev { position: absolute; z-index: 2; background: var(--event); border-left: 4px solid var(--event-edge); border-radius: 6px; padding: .3rem .55rem; overflow: hidden; font-size: .85rem; line-height: 1.3; box-shadow: 0 1px 0 var(--line); }
.ev.deadline { border-left-color: var(--amber); background: var(--amber-wash); }
.ev b { display: block; }
.gap { position: absolute; left: 14px; right: 10px; z-index: 1; border: 1.5px dashed var(--faint); border-radius: 6px; display: grid; place-items: center; color: var(--slate); font-size: .8rem; }

/* side */
.side { background: var(--panel); border-radius: 14px; padding: 20px; display: grid; gap: 28px; }
.dl { display: grid; gap: .55rem; margin: 0; padding: 0; list-style: none; }
.dl li { display: grid; grid-template-columns: 3.4rem 1fr; gap: .7rem; align-items: center; }
.days { font-family: var(--display); font-weight: 700; font-size: 1.05rem; text-align: center; padding: .25rem 0; border-radius: 8px; background: var(--amber-wash); color: var(--amber-ink); line-height: 1.1; }
.days small { display: block; font: 400 .7rem/1 var(--text); }
.mail { display: grid; gap: .9rem; margin: 0; padding: 0; list-style: none; }
.mail li { border-left: 3px solid var(--line); padding-left: .7rem; }
.mail li.hot { border-left-color: var(--amber); }
.mail .who { font-size: .8rem; color: var(--slate); display: flex; justify-content: space-between; gap: .5rem; }
.mail .subj { font-weight: 700; }
.mail .unread::before { content: ""; display: inline-block; width: .5rem; height: .5rem; border-radius: 50%; background: var(--amber); margin-right: .4rem; vertical-align: .1em; }
.reasons { display: flex; flex-wrap: wrap; gap: .3rem; margin-top: .35rem; }
.reasons span { font-size: .72rem; padding: .05rem .45rem; border-radius: 999px; background: var(--mist); color: var(--slate); }
.match { display: grid; gap: .2rem; }
.match .vs { font-family: var(--display); font-size: 1.3rem; font-weight: 700; color: var(--blue); }
.more { background: none; border: 0; padding: 0; color: var(--slate); text-decoration: underline; cursor: pointer; font-size: .875rem; margin-top: .6rem; }

/* week */
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 900px) { .week { grid-template-columns: 1fr; } }
.day { background: var(--panel); border-radius: 12px; padding: 12px; min-height: 9rem; }
.day.is-today { box-shadow: inset 0 0 0 2px var(--ink); }
.day h3 { font-size: 1rem; }
.day h3 span { display: block; font: 400 .78rem var(--text); color: var(--slate); margin-top: .15rem; }
.day ul { list-style: none; margin: .6rem 0 0; padding: 0; display: grid; gap: .45rem; }
.day li { font-size: .85rem; line-height: 1.3; }
.day li time { display: block; color: var(--slate); font-size: .75rem; }
.day li.deadline { color: var(--amber-ink); font-weight: 700; }
.day li.all { padding: .15rem .45rem; background: var(--mist); border-radius: 6px; }

/* inbox */
.inbox { max-width: 46rem; }
.inbox .mail li { padding-bottom: .9rem; border-bottom: 1px solid var(--line); }
.inbox .preview { color: var(--slate); margin-top: .2rem; }

/* football */
.fb { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 32px; align-items: start; }
@media (max-width: 820px) { .fb { grid-template-columns: 1fr; } }
.fixture { background: var(--blue-wash); border-radius: 14px; padding: 22px; margin-bottom: 24px; }
.fixture .vs { font-family: var(--display); font-weight: 700; font-size: clamp(1.6rem, 4vw, 2.3rem); color: var(--blue); line-height: 1.1; margin: .2rem 0 .5rem; }
.form { display: grid; gap: .4rem; list-style: none; margin: 0; padding: 0; }
.form li { display: grid; grid-template-columns: 1.8rem 1fr auto; gap: .6rem; align-items: center; }
.pill { width: 1.8rem; height: 1.8rem; border-radius: 6px; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: .85rem; }
.pill.W { background: var(--win); } .pill.D { background: var(--draw); } .pill.L { background: var(--loss); }
table { width: 100%; border-collapse: collapse; font-size: .9rem; font-variant-numeric: tabular-nums; }
th { text-align: left; font-weight: 400; color: var(--slate); font-size: .8rem; padding: .35rem .4rem; border-bottom: 1px solid var(--line); }
td { padding: .35rem .4rem; border-bottom: 1px solid var(--line); }
td.n, th.n { text-align: right; }
tr.us td { background: var(--blue-wash); color: var(--blue); font-weight: 700; }
@media (prefers-reduced-motion: no-preference) {
  .panel-in { animation: in .25s ease-out; }
  @keyframes in { from { opacity: 0; transform: translateY(4px); } }
}
</style>
</head>
<body>

<main class="lock" id="lock">
  <form id="lockform" autocomplete="off">
    <h1>Today</h1>
    <p class="muted" id="lockdate"></p>
    <label for="pass">Passphrase</label>
    <input id="pass" type="password" autocomplete="current-password" required>
    <label class="check"><input type="checkbox" id="remember"> Remember on this device</label>
    <button class="primary" id="unlock" type="submit">Unlock</button>
    <p class="lock-error" id="lockerr" role="alert"></p>
  </form>
</main>

<div class="wrap" id="app" hidden>
  <header class="top">
    <span class="date" id="hdate"></span>
    <span class="updated"><span id="updated"></span><br><button class="lockbtn" id="lockbtn" type="button">Lock</button></span>
  </header>
  <nav role="tablist" aria-label="Dashboard sections" id="tabs">
    <button role="tab" id="t-today" aria-controls="p-today" aria-selected="true">Today</button>
    <button role="tab" id="t-week" aria-controls="p-week" aria-selected="false" tabindex="-1">Week</button>
    <button role="tab" id="t-inbox" aria-controls="p-inbox" aria-selected="false" tabindex="-1">Inbox</button>
    <button role="tab" id="t-football" aria-controls="p-football" aria-selected="false" tabindex="-1">Football</button>
  </nav>
  <section role="tabpanel" id="p-today" aria-labelledby="t-today" tabindex="0"></section>
  <section role="tabpanel" id="p-week" aria-labelledby="t-week" tabindex="0" hidden></section>
  <section role="tabpanel" id="p-inbox" aria-labelledby="t-inbox" tabindex="0" hidden></section>
  <section role="tabpanel" id="p-football" aria-labelledby="t-football" tabindex="0" hidden></section>
</div>

<script>
const TZ = "Europe/London", KEY = "ld-pass", $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = { get() { try { return localStorage.getItem(KEY); } catch { return null; } },
                set(v) { try { localStorage.setItem(KEY, v); } catch {} },
                clear() { try { localStorage.removeItem(KEY); } catch {} } };

// ---- crypto (mirrors dashboard/crypto.py) ----
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(blob, pass) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(blob.salt), iterations: 600000, hash: "SHA-256" },
                                            base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(blob.iv) }, key, b64(blob.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

// ---- time helpers (always London) ----
const fmt = (o) => new Intl.DateTimeFormat("en-GB", { timeZone: TZ, ...o });
const dayKey = d => fmt({ year: "numeric", month: "2-digit", day: "2-digit" }).format(d).split("/").reverse().join("-");
const hm = iso => fmt({ hour: "2-digit", minute: "2-digit" }).format(new Date(iso));
const mins = iso => { const [h, m] = hm(iso).split(":").map(Number); return h * 60 + m; };
const longDate = d => fmt({ weekday: "long", day: "numeric", month: "long" }).format(d);
const shortDay = key => fmt({ weekday: "short", day: "numeric" }).format(new Date(key + "T12:00:00Z"));
const addDays = (key, n) => { const d = new Date(key + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const ago = iso => { const h = Math.round((Date.now() - new Date(iso)) / 36e5); return h < 1 ? "just now" : h < 24 ? `${h}h ago` : `${Math.round(h / 24)}d ago`; };
const DEADLINE = /deadline|due|submit|submission|hand.?in|exam/i;

function onDay(e, key) {
  if (e.all_day) return e.start <= key && (key < e.end || e.start === e.end && key === e.start);
  const s = dayKey(new Date(e.start)), end = dayKey(new Date(new Date(e.end) - 1));
  return s <= key && key <= (end < s ? s : end);
}

const WX = [[0,"Clear","☀️"],[1,"Mostly clear","🌤️"],[2,"Partly cloudy","⛅"],[3,"Overcast","☁️"],[45,"Fog","🌫️"],[48,"Fog","🌫️"],
  [51,"Drizzle","🌦️"],[53,"Drizzle","🌦️"],[55,"Drizzle","🌦️"],[56,"Freezing drizzle","🌧️"],[57,"Freezing drizzle","🌧️"],
  [61,"Light rain","🌧️"],[63,"Rain","🌧️"],[65,"Heavy rain","🌧️"],[66,"Freezing rain","🌧️"],[67,"Freezing rain","🌧️"],
  [71,"Light snow","🌨️"],[73,"Snow","🌨️"],[75,"Heavy snow","❄️"],[77,"Snow grains","🌨️"],[80,"Showers","🌦️"],[81,"Showers","🌦️"],
  [82,"Heavy showers","⛈️"],[85,"Snow showers","🌨️"],[86,"Snow showers","🌨️"],[95,"Thunderstorm","⛈️"],[96,"Thunderstorm","⛈️"],[99,"Thunderstorm","⛈️"]];
const wx = c => { const r = WX.find(x => x[0] === c); return r ? { label: r[1], icon: r[2] } : { label: "", icon: "" }; };
const failed = x => !x || (!Array.isArray(x) && x.error);
const errBox = what => `<p class="err">Couldn't load ${what}. It will try again at the next daily update.</p>`;

// ---- render ----
let D;
function render(data) {
  D = data;
  const now = new Date(), today = dayKey(now);
  $("#hdate").textContent = longDate(now);
  const gen = new Date(D.generated), stale = now - gen > 26 * 36e5;
  const up = $("#updated");
  up.textContent = stale ? `Out of date: last updated ${fmt({ weekday: "short", hour: "2-digit", minute: "2-digit" }).format(gen)}`
                         : `Updated ${hm(D.generated)}`;
  up.parentElement.classList.toggle("stale", stale);
  renderToday(today, now); renderWeek(today); renderInbox(); renderFootball();
}

function renderToday(today, now) {
  const w = failed(D.weather) ? null : D.weather;
  const hours = w ? w.hourly.filter(h => h.time.startsWith(today)) : [];
  const daily = w?.daily.find(d => d.date === today);
  const curHour = hours.find(h => +h.time.slice(11, 13) === +hm(now.toISOString()).slice(0, 2)) || hours[8];
  let hero;
  if (!w) hero = `<h1>Check the sky before you go</h1>${errBox("the weather")}`;
  else {
    const c = wx(curHour?.code);
    hero = `<h1>${esc(D.wear?.text || "No forecast for today")}</h1>
      <p class="wx">${c.icon} <strong>${Math.round(curHour?.temp)}°</strong> now, feels ${Math.round(curHour?.feels)}°. ${esc(c.label)}.
      ${daily ? `High ${Math.round(daily.max)}°, low ${Math.round(daily.min)}°. Sunset ${daily.sunset.slice(11)}.` : ""}</p>`;
  }

  // timeline
  let tl;
  if (failed(D.events)) tl = errBox("your calendar");
  else {
    const evs = D.events.filter(e => onDay(e, today));
    const allDay = evs.filter(e => e.all_day), timed = evs.filter(e => !e.all_day);
    const startH = Math.min(7, ...timed.map(e => Math.floor(mins(e.start) / 60))), endH = Math.max(23, ...timed.map(e => Math.ceil(mins(e.end) / 60)));
    const PX = 52, top = m => (m - startH * 60) / 60 * PX, H = (endH - startH) * PX;
    let marks = "", grid = "", rain = "", lit = "";
    for (let h = startH; h <= endH; h++) {
      const hr = hours.find(x => +x.time.slice(11, 13) === h);
      marks += `<span class="hour" style="top:${top(h * 60)}px"><b>${String(h).padStart(2, "0")}:00</b>${hr && h < endH ? `${wx(hr.code).icon} ${Math.round(hr.temp)}°` : ""}</span>`;
      grid += `<div class="gridline" style="top:${top(h * 60)}px"></div>`;
      if (hr && h < endH && hr.rain >= 20) rain += `<div class="rainbar" title="${hr.rain}% chance of rain" style="top:${top(h * 60) + 4}px;height:${PX - 8}px;opacity:${Math.min(1, hr.rain / 80)}"></div>`;
    }
    if (daily) {
      const sr = +daily.sunrise.slice(11, 13) * 60 + +daily.sunrise.slice(14, 16), ss = +daily.sunset.slice(11, 13) * 60 + +daily.sunset.slice(14, 16);
      lit = `<div class="daylight" style="top:${Math.max(0, top(sr))}px;height:${Math.max(0, top(ss) - Math.max(0, top(sr)))}px"></div>`;
    }
    // lanes for overlapping events
    const sorted = [...timed].sort((a, b) => a.start.localeCompare(b.start)), lanes = [];
    sorted.forEach(e => { let i = lanes.findIndex(end => end <= e.start); if (i < 0) { i = lanes.length; lanes.push(""); } lanes[i] = e.end; e._lane = i; });
    const n = Math.max(1, lanes.length);
    const blocks = sorted.map(e => {
      const s = mins(e.start), dur = Math.max(30, mins(e.end) - s);
      return `<div class="ev ${DEADLINE.test(e.title) ? "deadline" : ""}" style="top:${top(s) + 1}px;height:${dur / 60 * PX - 2}px;left:calc(${e._lane / n * 100}% + 12px);width:calc(${100 / n}% - 18px)">
        <b>${esc(e.title)}</b><span class="muted">${hm(e.start)}${e.end !== e.start ? "–" + hm(e.end) : ""}${e.location ? ", " + esc(e.location) : ""}</span></div>`;
    }).join("");
    const gaps = (D.gaps || []).map(g => { const s = mins(g.start); return g.minutes >= 90 ?
      `<div class="gap" style="top:${top(s) + 6}px;height:${g.minutes / 60 * PX - 12}px">Free ${g.minutes >= 120 ? Math.floor(g.minutes / 60) + "h" + (g.minutes % 60 ? " " + g.minutes % 60 + "m" : "") : g.minutes + " min"}</div>` : ""; }).join("");
    const nm = mins(now.toISOString()), nowLine = nm >= startH * 60 && nm <= endH * 60 ? `<div class="now" style="top:${top(nm)}px" aria-hidden="true"></div>` : "";
    tl = `${allDay.length ? `<div class="allday">${allDay.map(e => `<span class="chip">${esc(e.title)}</span>`).join("")}</div>` : ""}
      ${timed.length ? "" : `<p class="empty" style="margin-bottom:.6rem">Nothing booked today.</p>`}
      <div class="timeline" style="height:${H}px"><div class="hours" aria-hidden="true">${marks}</div>
      <div class="track">${lit}${grid}${rain}${gaps}${blocks}${nowLine}</div></div>`;
  }

  // side panel
  const soon = (D.deadlines || []).filter(d => d.days_left <= 7);
  const dl = soon.length ? `<ul class="dl">${soon.map(d => `<li><span class="days">${d.days_left === 0 ? "Today" : d.days_left}${d.days_left ? `<small>${d.days_left === 1 ? "day" : "days"}</small>` : ""}</span>
      <span><b>${esc(d.title)}</b><br><span class="muted small">${shortDay(d.due)}${d.source === "email" ? ", from an email" : ""}</span></span></li>`).join("")}</ul>`
    : `<p class="empty">Nothing due in the next 7 days.</p>`;
  const mail = failed(D.emails) ? errBox("your email") : D.emails.length
    ? `<ul class="mail">${D.emails.slice(0, 5).map(mailItem).join("")}</ul>${D.emails.length > 5 ? `<button class="more" data-go="inbox">See all ${D.emails.length} in Inbox</button>` : ""}`
    : `<p class="empty">Nothing in your inbox needs you right now.</p>`;
  const f = failed(D.football) ? null : D.football;
  const match = !D.football || failed(D.football) ? errBox("Chelsea fixtures") : f.next ? `<div class="match"><span class="vs">${f.next.home ? "Chelsea v " + esc(f.next.opponent) : esc(f.next.opponent) + " v Chelsea"}</span>
      <span class="muted">${fmt({ weekday: "long", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }).format(new Date(f.next.date))}, ${esc(f.next.competition)}</span></div>`
    : `<p class="empty">No fixture scheduled yet.</p>`;

  $("#p-today").innerHTML = `<div class="hero">${hero}</div><div class="today">
    <div><h2>Your day</h2>${tl}</div>
    <aside class="side"><div><h2>Due this week</h2>${dl}</div><div><h2>Needs a reply</h2>${mail}</div><div><h2>Next match</h2>${match}</div></aside></div>`;
}

function mailItem(m, full) {
  return `<li class="${m.score >= 6 ? "hot" : ""}"><div class="who"><span>${esc(m.from.replace(/\s*<.*>/, ""))}</span><span>${m.date ? ago(m.date) : ""}</span></div>
    <div class="subj ${m.unread ? "unread" : ""}">${esc(m.subject)}</div>
    ${full === true ? `<p class="preview">${esc(m.preview)}</p><div class="reasons">${m.reasons.map(r => `<span>${esc(r)}</span>`).join("")}</div>` : ""}</li>`;
}

function renderWeek(today) {
  if (failed(D.events)) { $("#p-week").innerHTML = errBox("your calendar"); return; }
  const daily = failed(D.weather) ? [] : D.weather.daily;
  let html = "";
  for (let i = 0; i < 7; i++) {
    const key = addDays(today, i), w = daily.find(d => d.date === key);
    const evs = D.events.filter(e => onDay(e, key)).sort((a, b) => (b.all_day - a.all_day) || a.start.localeCompare(b.start));
    const dls = (D.deadlines || []).filter(d => d.due === key && d.source === "email");
    html += `<div class="day ${i === 0 ? "is-today" : ""}"><h3>${i === 0 ? "Today" : shortDay(key)}${w ? `<span>${Math.round(w.max)}° / ${Math.round(w.min)}°${w.rain >= 40 ? ", rain " + w.rain + "%" : ""}</span>` : ""}</h3>
      <ul>${evs.map(e => `<li class="${e.all_day ? "all" : ""} ${DEADLINE.test(e.title) ? "deadline" : ""}">${e.all_day ? "" : `<time>${hm(e.start)}</time>`}${esc(e.title)}</li>`).join("")}
      ${dls.map(d => `<li class="deadline"><time>Due</time>${esc(d.title)}</li>`).join("")}
      ${evs.length + dls.length ? "" : `<li class="muted">Free day</li>`}</ul></div>`;
  }
  $("#p-week").innerHTML = `<div class="week">${html}</div>`;
}

function renderInbox() {
  $("#p-inbox").innerHTML = `<div class="inbox"><h2>Emails that need your attention</h2>
    <p class="muted small" style="margin-bottom:1rem">From the last 3 days, ranked by who sent them and what they say.</p>
    ${failed(D.emails) ? errBox("your email") : D.emails.length ? `<ul class="mail">${D.emails.map(m => mailItem(m, true)).join("")}</ul>` : `<p class="empty">Nothing in your inbox needs you right now.</p>`}</div>`;
}

function renderFootball() {
  if (failed(D.football)) { $("#p-football").innerHTML = errBox("Chelsea fixtures and the table"); return; }
  const f = D.football, n = f.next;
  const fixture = n ? `<div class="fixture"><span class="muted">Next match, ${esc(n.competition)}</span>
      <div class="vs">${n.home ? "Chelsea v " + esc(n.opponent) : esc(n.opponent) + " v Chelsea"}</div>
      <span>${fmt({ weekday: "long", day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" }).format(new Date(n.date))}${n.home ? ", Stamford Bridge" : ", away"}</span></div>`
    : `<p class="empty" style="margin-bottom:24px">No fixture scheduled yet.</p>`;
  const form = f.results.length ? `<ul class="form">${f.results.map(r => `<li><span class="pill ${r.outcome}" aria-label="${{ W: "Win", D: "Draw", L: "Loss" }[r.outcome]}">${r.outcome}</span>
      <span>${r.home ? "v" : "at"} ${esc(r.opponent)}<br><span class="muted small">${fmt({ day: "numeric", month: "short" }).format(new Date(r.date))}</span></span><b>${esc(r.score)}</b></li>`).join("")}</ul>`
    : `<p class="empty">No results yet this season.</p>`;
  const table = `<table><caption class="muted small" style="text-align:left;padding-bottom:.4rem">Premier League table</caption><thead><tr><th class="n">#</th><th>Team</th><th class="n">P</th><th class="n">GD</th><th class="n">Pts</th></tr></thead><tbody>
    ${f.table.map(r => `<tr class="${r.is_team ? "us" : ""}"><td class="n">${r.pos}</td><td>${esc(r.team)}</td><td class="n">${r.played}</td><td class="n">${r.gd > 0 ? "+" : ""}${r.gd}</td><td class="n">${r.points}</td></tr>`).join("")}</tbody></table>`;
  $("#p-football").innerHTML = `<div class="fb"><div>${fixture}<h2>Recent results</h2>${form}</div><div>${table}</div></div>`;
}

// ---- tabs ----
const tabs = [...document.querySelectorAll("[role=tab]")];
function select(tab, focus) {
  tabs.forEach(t => { const on = t === tab; t.setAttribute("aria-selected", on); t.tabIndex = on ? 0 : -1;
    const p = document.getElementById(t.getAttribute("aria-controls")); p.hidden = !on; if (on) { p.classList.remove("panel-in"); void p.offsetWidth; p.classList.add("panel-in"); } });
  if (focus) tab.focus();
  try { sessionStorage.setItem("ld-tab", tab.id); } catch {}
}
tabs.forEach((t, i) => {
  t.addEventListener("click", () => select(t));
  t.addEventListener("keydown", e => {
    const k = { ArrowRight: 1, ArrowLeft: -1, Home: -i, End: tabs.length - 1 - i }[e.key];
    if (k !== undefined) { e.preventDefault(); select(tabs[(i + k + tabs.length) % tabs.length], true); }
  });
});
document.addEventListener("click", e => { const go = e.target.closest("[data-go]"); if (go) select($("#t-" + go.dataset.go), true); });

// ---- unlock ----
let blob;
async function unlock(pass, remember, auto) {
  const btn = $("#unlock"), err = $("#lockerr");
  btn.disabled = true; btn.textContent = "Unlocking…"; err.textContent = "";
  try {
    blob = blob || await fetch("data.enc", { cache: "no-store" }).then(r => { if (!r.ok) throw new Error("missing"); return r.json(); });
  } catch {
    err.textContent = "The dashboard data hasn't been built yet. Run the daily update in GitHub, then reload.";
    btn.disabled = false; btn.textContent = "Unlock"; return;
  }
  try {
    const data = await decrypt(blob, pass);
    if (remember) store.set(pass);
    render(data);
    $("#lock").hidden = true; $("#app").hidden = false;
    let saved; try { saved = sessionStorage.getItem("ld-tab"); } catch {}
    if (saved && document.getElementById(saved)) select(document.getElementById(saved));
  } catch {
    if (auto) store.clear();
    err.textContent = auto ? "The saved passphrase no longer works. Enter the current one." : "Wrong passphrase. Check it and try again.";
    $("#pass").select();
  }
  btn.disabled = false; btn.textContent = "Unlock";
}
$("#lockdate").textContent = longDate(new Date());
$("#lockform").addEventListener("submit", e => { e.preventDefault(); unlock($("#pass").value, $("#remember").checked); });
$("#lockbtn").addEventListener("click", () => { store.clear(); location.reload(); });
const saved = store.get();
if (saved) unlock(saved, false, true); else $("#pass").focus();
</script>
